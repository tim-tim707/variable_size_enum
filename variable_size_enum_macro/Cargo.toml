[package]
name = "variable_size_enum_macro"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
variable_size_enum = { path = ".." }
trybuild = "1"
